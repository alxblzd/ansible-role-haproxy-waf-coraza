---

- name: HAProxy WAF | Checking if Binary exists
  ansible.builtin.stat:
    path: "{{ WAF_HC.path.file.bin }}"
  register: waf_bin

- name: HAProxy WAF | Resolve Coraza SPOA install method
  ansible.builtin.set_fact:
    coraza_spoa_install_method_resolved: >-
      {% set arch_val = (ansible_architecture | lower) %}
      {% if coraza_spoa_install_method == 'auto' %}
      {%   if arch_val in ['x86_64', 'amd64'] %}binary{% elif arch_val in ['aarch64', 'arm64'] %}source{% else %}binary{% endif %}
      {% else %}{{ coraza_spoa_install_method }}
      {% endif %}
    coraza_spoa_version_resolved: "{{ coraza_spoa_version | default(WAF_CONFIG.release) }}"

- name: HAProxy WAF | Fail if binary install is requested on unsupported architecture
  ansible.builtin.fail:
    msg: "Coraza SPOA binaries are not supported on ARM64. Set coraza_spoa_install_method=source or auto for this architecture."
  when:
    - coraza_spoa_install_method_resolved == 'binary'
    - ansible_architecture | lower in ['aarch64', 'arm64']

- name: HAProxy WAF | Fail if Binary is missing
  ansible.builtin.fail:
    msg: |
      The WAF binary '{{  WAF_HC.path.file.bin }}' does not exist!
      Either enable the 'waf.install_bin' setting..
      or download the source-code from https://github.com/O-X-L/coraza-spoa and compile it yourself!
  when:
    - not WAF_CONFIG.install_bin | bool
    - not waf_bin.stat.exists

- name: HAProxy WAF | Add tmp-dir
  ansible.builtin.file:
    path: '/tmp/coraza'
    state: directory
    mode: 0750
  when:
    - WAF_CONFIG.install_bin | bool
    - not waf_bin.stat.exists or force_update | bool
    - coraza_spoa_install_method_resolved == 'binary'

- name: "HAProxy WAF | Download Binary ({{ WAF_HC.url.bin }})"
  ansible.builtin.unarchive:
    src: "{{ WAF_HC.url.bin }}"
    dest: '/tmp/coraza'
    remote_src: true
    mode: 0750
  when:
    - WAF_CONFIG.install_bin | bool
    - not waf_bin.stat.exists or force_update | bool
    - coraza_spoa_install_method_resolved == 'binary'

- name: HAProxy WAF | Move Binary
  ansible.builtin.copy:
    src: "/tmp/coraza/{{ WAF_HC.path.file.bin_src }}"
    dest: "{{ WAF_HC.path.file.bin }}"
    remote_src: true
    owner: 'root'
    group: "{{ WAF_HC.user }}"
    mode: 0750
  when:
    - WAF_CONFIG.install_bin | bool
    - not waf_bin.stat.exists or force_update | bool
    - coraza_spoa_install_method_resolved == 'binary'

- name: HAProxy WAF | Build Coraza SPOA from source
  ansible.builtin.import_tasks: debian/install_source.yml
  when:
    - coraza_spoa_install_method_resolved == 'source'

- name: HAProxy WAF | Create service-override directory
  ansible.builtin.file:
    path: '/etc/systemd/system/coraza-spoa.service.d/'
    state: directory
    mode: 0755

- name: HAProxy WAF | Create service-override
  ansible.builtin.template:
    src: 'templates/etc/systemd/system/coraza-spoa.service.d/override.conf.j2'
    dest: '/etc/systemd/system/coraza-spoa.service.d/override.conf'
    mode: 0644
  notify: ['Daemon-reload', 'WAF-restart', 'Check-failed']

- name: HAProxy WAF | Create service
  ansible.builtin.get_url:
    url: "{{ WAF_HC.url.service }}"
    dest: '/etc/systemd/system/coraza-spoa.service'
    mode: 0644
  notify: ['Daemon-reload', 'WAF-restart', 'Check-failed']

- name: HAProxy WAF | Start & Enable Service
  ansible.builtin.systemd:
    daemon_reload: true
    name: 'coraza-spoa.service'
    state: started
    enabled: true
