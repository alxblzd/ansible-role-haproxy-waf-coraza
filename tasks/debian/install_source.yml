- name: HAProxy WAF | Set source build paths
  ansible.builtin.set_fact:
    coraza_spoa_build_root: /tmp/coraza
    coraza_spoa_build_dir: /tmp/coraza/coraza-spoa
    coraza_spoa_marker_file: "{{ WAF_HC.path.cnf }}/.coraza-spoa-version"
    coraza_spoa_installed_version: ""

- name: HAProxy WAF | Check installed source build marker
  ansible.builtin.stat:
    path: "{{ coraza_spoa_marker_file }}"
  register: coraza_spoa_marker_stat

- name: HAProxy WAF | Read installed source build marker
  ansible.builtin.slurp:
    path: "{{ coraza_spoa_marker_file }}"
  register: coraza_spoa_marker_content
  when: coraza_spoa_marker_stat.stat.exists

- name: HAProxy WAF | Current installed source version
  ansible.builtin.set_fact:
    coraza_spoa_installed_version: "{{ coraza_spoa_marker_content.content | b64decode | trim }}"
  when: coraza_spoa_marker_stat.stat.exists

- name: HAProxy WAF | Evaluate if source rebuild is required
  ansible.builtin.set_fact:
    coraza_spoa_rebuild_required: >-
      {{ coraza_spoa_force_rebuild | bool
         or force_update | bool
         or (not waf_bin.stat.exists)
         or (coraza_spoa_installed_version != coraza_spoa_version_resolved) }}

- name: HAProxy WAF | Build Coraza SPOA from source
  when: coraza_spoa_rebuild_required | bool
  block:
    - name: HAProxy WAF | Install build dependencies (Debian)
      ansible.builtin.apt:
        name:
          - git
          - build-essential
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: HAProxy WAF | Ensure build directory exists
      ansible.builtin.file:
        path: "{{ coraza_spoa_build_root }}"
        state: directory
        mode: "0750"

    - name: HAProxy WAF | Checkout Coraza SPOA source
      ansible.builtin.git:
        repo: "{{ coraza_spoa_repo }}"
        dest: "{{ coraza_spoa_build_dir }}"
        version: "{{ coraza_spoa_version_resolved }}"
        force: "{{ coraza_spoa_force_rebuild | bool }}"
        update: yes

    # Detect go without hardcoding paths:
    # - Try PATH first
    # - Then search common prefixes for "go" binaries
    - name: HAProxy WAF | Detect Go toolchain (PATH)
      ansible.builtin.shell: command -v go
      args:
        executable: /bin/bash
      register: coraza_go_detect_path
      changed_when: false
      failed_when: false

    - name: HAProxy WAF | Find Go binaries on disk (fallback)
      ansible.builtin.find:
        paths:
          - /usr/local
          - /usr
          - /opt
          - /snap
        patterns: go
        file_type: file
        recurse: true
        follow: false
        # Keep it reasonably fast
        depth: 6
      register: coraza_go_find
      changed_when: false
      when: coraza_go_detect_path.stdout | trim == ""

    - name: HAProxy WAF | Select Go binary
      ansible.builtin.set_fact:
        coraza_go_bin: >-
          {{
            (coraza_go_detect_path.stdout | trim)
            if (coraza_go_detect_path.stdout | trim) != ""
            else
              (
                coraza_go_find.files
                | map(attribute='path')
                | select('match', '.*/bin/go$')
                | reject('match', '.*/go/testdata/.*')
                | reject('match', '.*/go/pkg/.*')
                | reject('match', '.*/go/src/.*')
                | list
                | first
                | default('')
              )
          }}

    - name: HAProxy WAF | Fail when Go toolchain is missing
      ansible.builtin.fail:
        msg: "Go toolchain not found. Install Go or set coraza_spoa_install_method=binary."
      when: coraza_go_bin | trim == ""

    - name: HAProxy WAF | Go version
      ansible.builtin.command: "{{ coraza_go_bin }} version"
      changed_when: false

    # Build per Coraza docs: go run mage.go build -> build/coraza-spoa
    - name: HAProxy WAF | Build Coraza SPOA using mage
      ansible.builtin.command: "{{ coraza_go_bin }} run mage.go build"
      args:
        chdir: "{{ coraza_spoa_build_dir }}"
      environment:
        GO111MODULE: "on"

    - name: HAProxy WAF | Check built binary
      ansible.builtin.stat:
        path: "{{ coraza_spoa_build_dir }}/build/coraza-spoa"
      register: coraza_spoa_built_bin

    - name: HAProxy WAF | Fail if build did not produce binary
      ansible.builtin.fail:
        msg: "Coraza SPOA build failed: build/coraza-spoa not found."
      when: not coraza_spoa_built_bin.stat.exists

    - name: HAProxy WAF | Install Coraza SPOA binary
      ansible.builtin.copy:
        src: "{{ coraza_spoa_build_dir }}/build/coraza-spoa"
        dest: "{{ WAF_HC.path.file.bin }}"
        remote_src: true
        owner: root
        group: "{{ WAF_HC.user }}"
        mode: "0750"

    - name: HAProxy WAF | Write source build marker
      ansible.builtin.copy:
        dest: "{{ coraza_spoa_marker_file }}"
        content: "{{ coraza_spoa_version_resolved }}"
        owner: root
        group: root
        mode: "0644"
