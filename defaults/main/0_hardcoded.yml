---

arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

WAF_HC:
  user: 'coraza'
  path:
    cnf: '/etc/coraza-spoa'
    log: '/var/log/coraza-spoa'
    rule_script: '/usr/local/bin/waf_coraza_rule_update.py'
    file:
      bin: '/usr/bin/coraza-spoa'
      bin_src: "coraza-spoa-linux-{{ arch }}"
      cnf_main: 'main.conf'
      cnf_spoa: 'spoa.yml'
    dir:
      cnf_rules: 'apps'

  app_var: 'txn.waf_app'

  url:
    service: 'https://raw.githubusercontent.com/corazawaf/coraza-spoa/main/contrib/coraza-spoa.service'
    bin: "https://github.com/corazawaf/coraza-spoa/releases/download/{{ coraza_spoa_version | default(WAF_CONFIG.release) }}/coraza-spoa-linux-{{ arch }}.tar.gz"
    crs_1: 'https://github.com/corazawaf/coraza-coreruleset/archive/refs/tags/'
    crs_2: '.tar.gz'
